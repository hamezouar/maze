[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "0.0.1"
description = "package for generator maze"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Mohamed Bidlal" },
  { name = "Hamza Amezouar" }
]
[tool.setuptools.packages.find]
where = ["."]
include = ["mazegen"] 
exclude = ["maze_output"]